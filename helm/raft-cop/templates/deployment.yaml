apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raft-cop.fullname" . }}
  labels:
    {{- include "raft-cop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "raft-cop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "raft-cop.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.env.KAFKA_BOOTSTRAP_SERVERS | quote }}
            - name: STREAMS_APPLICATION_ID
              value: {{ .Values.env.STREAMS_APPLICATION_ID | quote }}
            - name: SIMULATOR_ENABLED
              value: {{ .Values.env.SIMULATOR_ENABLED | quote }}
            - name: SPEED_THRESHOLD_KPH
              value: {{ .Values.app.speedThresholdKph | quote }}
            - name: FUEL_THRESHOLD_PCT
              value: {{ .Values.app.fuelThresholdPct | quote }}
            - name: WINDOW_SIZE_SECONDS
              value: {{ .Values.app.windowSizeSeconds | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.http }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- end }}
