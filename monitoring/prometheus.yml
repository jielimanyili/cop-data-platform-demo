global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'cop-data-platform'
    metrics_path: /actuator/prometheus
    static_configs:
      # The Spring Boot app runs on the host; from inside the prometheus container
      # the host is reachable as host.docker.internal on Docker Desktop.
      - targets: ['host.docker.internal:8080']
